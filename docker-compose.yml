
version: '3.8'

services:
  # ==========================================
  # Database Service & Cache
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: ts_postgres
    restart: always
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ts_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Monitoring Tools (Prometheus + Grafana)
  # ==========================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: ts_prometheus
  #   ports:
  #     - "9090:9090"
  #   # volumes:
  #   #   - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: ts_grafana
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin

  # ==========================================
  # Storage Services
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: ts_minio
    restart: always
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Application Services
  # ==========================================
  backend:
    build: ./backend
    container_name: ts_backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      - DATABASE_URL=host=postgres user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} port=5432 sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS}
      - DB_CONN_MAX_LIFETIME_MINUTES=${DB_CONN_MAX_LIFETIME_MINUTES}
      - TICKET_QUEUE_ENABLED=${TICKET_QUEUE_ENABLED}
      - TICKET_QUEUE_STREAM=${TICKET_QUEUE_STREAM}
      - TICKET_QUEUE_GROUP=${TICKET_QUEUE_GROUP}
      - TICKET_QUEUE_WORKERS=${TICKET_QUEUE_WORKERS}
      - TICKET_QUEUE_MAX_WAITING=${TICKET_QUEUE_MAX_WAITING}
      - TICKET_QUEUE_RESERVATION_TTL_SECONDS=${TICKET_QUEUE_RESERVATION_TTL_SECONDS}
      - TICKET_QUEUE_STATUS_TTL_SECONDS=${TICKET_QUEUE_STATUS_TTL_SECONDS}
      - EVENT_LIST_CACHE_TTL_SECONDS=${EVENT_LIST_CACHE_TTL_SECONDS}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ts_frontend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BACKEND_URL=${FRONTEND_BACKEND_URL:-http://backend:8001}
      - STORAGE_URL=${FRONTEND_STORAGE_URL:-http://minio:9000/}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
