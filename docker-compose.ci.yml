services:
  postgres:
    image: postgres:15-alpine
    container_name: ts_postgres_ci
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ticketing_system
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ts_redis_ci
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ts_minio_ci
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/ticketing-attachments || true &&
      exit 0;
      "

  backend:
    build:
      context: ./backend
    container_name: ts_backend_ci
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      DATABASE_URL: host=postgres user=postgres password=${DB_PASSWORD:-postgres} dbname=ticketing_system port=5432 sslmode=disable
      REDIS_URL: redis://redis:6379

      JWT_SECRET: test-secret
      PORT: 8001
      ALLOWED_ORIGINS: "*"
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-password}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: ticketing-attachments

    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    container_name: ts_frontend_ci
    depends_on:
      - backend

    environment:
      - PORT=8080
      - BACKEND_URL=${FRONTEND_BACKEND_URL:-http://backend:8001}
      - STORAGE_URL=${FRONTEND_STORAGE_URL:-http://minio:9000/}

    ports:
      - "8080:8080"