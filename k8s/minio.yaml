apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: default

---

apiVersion: v1
kind: Service
metadata:
  name: minio-service
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-10T01-41-38Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001

          volumeMounts:
            - name: data
              mountPath: /data


          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: "500Mi"
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: "2Gi"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc

---

apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
spec:
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-05-09T17-04-24Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for MinIO to start..."
              until mc alias set local http://minio-service:9000 $(kubectl get secret app-secret -o jsonpath='{.data.MINIO_ROOT_USER}' | base64 -d) $(kubectl get secret app-secret -o jsonpath='{.data.MINIO_ROOT_PASSWORD}' | base64 -d); do
                echo "MinIO not ready, retrying in 3 seconds..."
                sleep 3
              done

              echo "Creating bucket ticketing-attachments..."
              mc mb local/ticketing-attachments || true

              echo "Setting public download policy..."
              mc anonymous set download local/ticketing-attachments || true

              echo "MinIO initialization completed successfully!"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
  backoffLimit: 3
  ttlSecondsAfterFinished: 300