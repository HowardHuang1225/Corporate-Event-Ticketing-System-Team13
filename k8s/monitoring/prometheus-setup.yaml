apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-core
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: true
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
          - containerPort: 9090
        volumeMounts:
          - name: config-volume
            mountPath: /etc/prometheus/ # 把 ConfigMap 的內容變成實體檔案塞進去
        resources:
          requests:
            cpu: "200m"                
            memory: "256Mi"            
            ephemeral-storage: "500Mi"  
          limits:
            cpu: "500m"
            memory: "512Mi"           
            ephemeral-storage: "2Gi"
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-server-conf # 對齊 ConfigMap 名稱

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus