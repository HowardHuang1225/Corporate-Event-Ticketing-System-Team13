name: "CD to AKS"

on:
  push:
    branches:
      - main
      - feat/*
    paths:
      - 'k8s/**'
      - 'frontend/**'
      - 'backend/**'
      - 'api/**' 
      - docker-compose.yml
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          frontend:
            - 'frontend/**'
            - 'api/**'       
          backend:
            - 'backend/**'
            - 'api/**'      

  build-and-deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Convert repository owner and name to strict lowercase to satisfy GHCR requirements
    - name: Set lower-case environment variables
      id: vars
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        echo "owner=$OWNER" >> $GITHUB_OUTPUT
        echo "repo=$REPO" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build Frontend (Triggered when frontend or api changes)
    - name: Build and Push Frontend Image
      if: needs.check-changes.outputs.frontend == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repo }}/frontend:latest

    # Build Backend (Triggered when backend or api changes)
    - name: Build and Push Backend Image
      if: needs.check-changes.outputs.backend == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repo }}/backend:latest

    # Connect to Azure AKS Cluster
    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

    # Apply configuration manifests and dynamically patch image paths
    - name: Deploy and Inject Images to AKS
      run: |
        # 1. Create a temporary K8s credential registry key using the Action's built-in token
        # This acts as a pass-card so AKS can pull from your private GHCR repository
        kubectl create secret docker-registry ghcr-auth \
          --docker-server=ghcr.io \
          --docker-username=${{ github.actor }} \
          --docker-password=${{ secrets.GITHUB_TOKEN }} \
          --docker-email=team13@nthu.edu.tw \
          --dry-run=client -o yaml | kubectl apply -f -

        # 2. Apply your clean K8s YAML manifests
        kubectl apply -f k8s/ -R
        
        # 3. Inject the perfected lowercase registry paths
        OWNER="${{ steps.vars.outputs.owner }}"
        REPO="${{ steps.vars.outputs.repo }}"

        echo "[DEBUG] Real GHCR Path -> ghcr.io/$OWNER/$REPO"
        
        kubectl set image deployment/frontend-deployment frontend=ghcr.io/$OWNER/$REPO/frontend:latest
        kubectl set image deployment/backend-deployment backend=ghcr.io/$OWNER/$REPO/backend:latest
        
        # 4. CRITICAL: Force both deployments to carry the 'ghcr-auth' key to bypass the Private lock
        kubectl patch deployment frontend-deployment -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-auth\"}]}}}}"
        kubectl patch deployment backend-deployment -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-auth\"}]}}}}"
        
        # 5. Trigger rolling restart to consume the newly authorized private images
        kubectl rollout restart deployment/frontend-deployment || echo "ok"
        kubectl rollout restart deployment/backend-deployment || echo "ok"

        kubectl rollout restart deployment/prometheus-core -n monitoring || echo "ok"
        kubectl rollout restart deployment/grafana -n monitoring || echo "ok"