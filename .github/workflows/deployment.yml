name: Continuous Delivery to AKS

on:
  push:
    branches:
      - feat/cd
    paths:
      - 'k8s/**'
      - 'frontend/**'
      - 'backend/**'
      - 'api/**'      

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          frontend:
            - 'frontend/**'
            - 'api/**'       
          backend:
            - 'backend/**'
            - 'api/**'      

  build-and-deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 前端打包 (當 frontend 或 api 有改時觸發)
    - name: Build and Push Frontend Image
      if: needs.check-changes.outputs.frontend == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/frontend:latest

    # 後端打包 (當 backend 或 api 有改時觸發)
    - name: Build and Push Backend Image
      if: needs.check-changes.outputs.backend == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/backend:latest

    # 連線雲端 AKS 叢集
    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

    # 套用配置
    - name: Deploy and Inject Images to AKS
      run: |
        kubectl apply -f k8s/
        
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        
        kubectl set image deployment/frontend-deployment frontend=ghcr.io/$OWNER/$REPO/frontend:latest --background=true || echo "Frontend not ready"
        kubectl set image deployment/backend-deployment backend=ghcr.io/$OWNER/$REPO/backend:latest --background=true || echo "Backend not ready"
    
    # 滾動重啟
    - name: Rollout Restart Updated Deployments
      run: |
        if [ "${{ needs.check-changes.outputs.frontend }}" = "true" ]; then
          kubectl rollout restart deployment/frontend-deployment
        fi
        if [ "${{ needs.check-changes.outputs.backend }}" = "true" ]; then
          kubectl rollout restart deployment/backend-deployment
        fi