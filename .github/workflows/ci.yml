name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL'

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketing_system 
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: postgres
      POSTGRES_DB: ticketing_system
      POSTGRES_PASSWORD: postgres
      DB_NAME: ticketing_system
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      TEST_USER_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true   
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: cd backend && go mod download

      - name: Run tests and generate report summary
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres password=postgres dbname=ticketing_system port=5432 sslmode=disable
          REDIS_URL: redis://127.0.0.1:6379
          TEST_USER_PASSWORD: password
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./... | tee test_output.log
          
          echo ""
          echo "=================================================="
          echo "Go Test Report Summary"
          echo "=================================================="
          awk '
            /^ok / { pkgs_pass++ }
            /^FAIL/ { pkgs_fail++ }
            /--- PASS:/ { tests_pass++ }
            /--- FAIL:/ { tests_fail++ }
            END {
              total_pkgs = pkgs_pass + pkgs_fail;
              total_tests = tests_pass + tests_fail;
              printf "Test Packages: ✅ %d passed · %d total\n", pkgs_pass, total_pkgs;
              printf "Test Results:  ✅ %d passes · %d total\n", tests_pass, total_tests;
              if (pkgs_fail > 0 || tests_fail > 0) {
                print "❌ Status: Some tests failed.";
              } else {
                print "🟢 Status: All tests passed successfully!";
              }
            }
          ' test_output.log
          echo "=================================================="

      - name: Upload coverage report
        continue-on-error: true
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: backend-coverage-report
          path: backend/coverage.txt

      - name: Coverage Summary
        run: |
          cd backend
          echo "=================================================="
          echo "Code Coverage Summary"
          echo "=================================================="
          go tool cover -func=coverage.txt

  golangci:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@6a381c4728ee136cb90732e7c335037d08f92c03
        with:
          version: v2.12
          working-directory: ./backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --ignore-scripts

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage
          echo "=== 總單元測試覆蓋率 ==="
          node -e "
            const { total } = require('./coverage/coverage-summary.json');
            for (const [metric, data] of Object.entries(total)) {
              console.log(\`\${metric.padEnd(10)} \${data.pct}%\`);
            }
          "

      - name: Upload coverage report
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/lcov.info

      - name: Coverage Summary
        run: |
          cd frontend
          node -e "
            const { total } = require('./coverage/coverage-summary.json');
            console.log('=== 總單元測試覆蓋率 ===');
            for (const [metric, data] of Object.entries(total)) {
              console.log(\`\${metric.padEnd(10)} \${data.pct}%\`);
            }
          "

      - name: Check Code Style
        run: cd frontend && npm run lint --if-present

      - name: Build Frontend
        run: cd frontend && npm run build

  integration-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_DB: ticketing_system
      POSTGRES_PASSWORD: postgres
      DB_PORT: 5432
      REDIS_PORT: 6379
      JWT_SECRET: test-secret
      TEST_USER_PASSWORD: password
      PORT: 8080
      ALLOWED_ORIGINS: "*"
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: ticketing-attachments
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      FRONTEND_BACKEND_URL: http://backend:8001
      FRONTEND_STORAGE_URL: http://minio:9000/      
    steps:
      - uses: actions/checkout@v4

      - name: Build services
        run: docker compose -f docker-compose.ci.yml build

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            docker exec ts_backend_ci wget --spider -q http://localhost:8001/health && exit 0
            echo "waiting..."
            sleep 2
          done
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v